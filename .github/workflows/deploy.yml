name: Validate and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && npm test && npm run check
      - run: npm run icons && git diff --exit-code -- public/icons
      - name: Verify the committed site before rebuilding
        run: node scripts/check-build.mjs .
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:e2e -- --grep 'static hosting:|PWA:|integ2|longest cards'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
      - name: Stage the ready-to-serve root site
        run: |
          mkdir -p "$RUNNER_TEMP/nodit-pages"
          cp -R index.html assets icons sw.js manifest.webmanifest workbox-*.js .nojekyll "$RUNNER_TEMP/nodit-pages/"
          if [ -f registerSW.js ]; then cp registerSW.js "$RUNNER_TEMP/nodit-pages/"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/nodit-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
