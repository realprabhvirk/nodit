<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>%APP_NAME%</title>
    <meta name="description" content="Phone on your forehead. Your mates describe it. Nod to score." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.tsx"></script>
    <script>
      // If the app never mounts (e.g. the host served the unbuilt source),
      // say so instead of showing a blank screen.
      setTimeout(function () {
        var app = document.getElementById('app');
        if (app && !app.firstChild) {
          app.innerHTML =
            '<div style="font:17px/1.4 -apple-system,system-ui,sans-serif;padding:48px 24px;color:#0F1B2D;background:#F4F5F7;position:fixed;inset:0">' +
            '<b>%APP_NAME% didn\'t load.</b><br>If you just deployed it, check the build ran: build command <code>npm run build</code>, output folder <code>dist</code>.</div>';
        }
      }, 4000);
    </script>
  </body>
</html>
